PACKAGE_NAME="ov5693-surface"
PACKAGE_VERSION="1.0.0"

BUILT_MODULE_NAME[0]="ov5693"
# /lib/modules/<kver>/updates/dkms is searched before kernel/drivers, so this
# module shadows the in-tree ov5693.ko without replacing or deleting it.
DEST_MODULE_LOCATION[0]="/updates/dkms"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_source_tree} modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_source_tree} clean"

AUTOINSTALL="yes"
REMAKE_INITRD="no"
