PACKAGE_NAME="ov5693-surface"
PACKAGE_VERSION="1.0.0"

BUILT_MODULE_NAME[0]="ov5693"
# /lib/modules/<kver>/updates/dkms is searched before kernel/drivers, so this
# module shadows the in-tree ov5693.ko without replacing or deleting it.
DEST_MODULE_LOCATION[0]="/updates/dkms"

# DKMS builds in a copy of the source tree and runs MAKE with that build
# directory as the working directory, then looks for the .ko there. Passing
# M=${dkms_source_tree} would instead emit the module into /usr/src and the
# install would fail with "module not found" -- so let the Makefile default
# M to its own directory and only override which kernel to build against.
MAKE[0]="make KDIR=${kernel_source_dir} modules"
CLEAN="make KDIR=${kernel_source_dir} clean"

AUTOINSTALL="yes"
